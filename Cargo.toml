[package]
name = "shiguredo_vpl"
version = "2026.4.0-canary.1"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for Intel oneVPL (Video Processing Library)"
readme = "README.md"
homepage = "https://github.com/shiguredo/vpl-rs"
repository = "https://github.com/shiguredo/vpl-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/build.rs", "/src/**", "LICENSE", "README.md"]

# Intel VPL 用の外部ライブラリビルド用メタデータ
# (この内容は build.rs の中からのみ参照される)
#
# なお、bindgen はマクロ（#define）による定数や一部の static 変数の自動変換には対応していないため、
# それらは build.rs の中で直接定義しているので、必要に応じて build.rs も更新すること。
[package.metadata.external-dependencies.vpl]
url = "https://github.com/intel/libvpl"
version = "2.17.0"

[dependencies]

[build-dependencies]
bindgen = "0.72"
shiguredo_cmake = "4.3"
shiguredo_toml = "2026.2"
